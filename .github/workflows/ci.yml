name: Community Edition checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q mcp skills
      - name: Run deterministic evaluations
        run: python skills/oee-loss-analyzer/scripts/run_evals.py --all
      - name: Run MCP smoke test
        run: python mcp/smoke_test.py
