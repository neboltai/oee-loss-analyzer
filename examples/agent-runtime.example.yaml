# Illustrative application configuration. This is not an OpenAI, Claude or MCP
# standard and is not read automatically by either plugin host.
#
# A custom agent runtime (for example an application built with an agent SDK or
# orchestration framework) can map this shape to its own provider adapters. The
# OEE skill, deterministic scripts and MCP tools remain unchanged when the
# provider changes.

runtime:
  provider: "openai"
  model: "set-a-model-supported-by-your-provider"
  temperature: 0.1
  max_output_tokens: 4000

providers:
  openai:
    protocol: "openai"
    api_key_env: "OPENAI_API_KEY"
  anthropic:
    protocol: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
  groq:
    protocol: "openai-compatible"
    api_key_env: "GROQ_API_KEY"
    base_url_env: "GROQ_BASE_URL"
  deepseek:
    protocol: "openai-compatible"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url_env: "DEEPSEEK_BASE_URL"
  ollama:
    protocol: "openai-compatible"
    api_key_env: null
    base_url_env: "OLLAMA_BASE_URL"

agent:
  instructions_file: "../skills/oee-loss-analyzer/SKILL.md"
  output_schema: "../skills/oee-loss-analyzer/assets/finding.schema.json"
  mcp_server: "shopfloor-data"

security:
  allow_source_writes: false
  secrets_from_environment_only: true
